<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Casting — Scribble Pitch</title>
  <link rel="stylesheet" href="/templates/fonts/fonts.css">
  <link rel="stylesheet" href="/brand/tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--paper); color: var(--ink); font-family: var(--font-body); padding: 30px 40px; width: 1500px; }
    h1 { font-family: var(--font-title); font-size: 40px; margin-bottom: 6px; }
    .role { margin-top: 28px; }
    .role h2 { font-family: var(--font-title); font-size: 30px; border-bottom: 3px solid var(--ink); padding-bottom: 4px; }
    .row { display: flex; gap: 24px; margin-top: 12px; flex-wrap: wrap; }
    .cell { border: 2px dashed #bbb; border-radius: 10px; padding: 10px 14px; flex: 0 0 auto; max-width: 460px; }
    .cell .poses { display: flex; gap: 6px; align-items: flex-end; }
    .cell .label { font-size: 21px; margin-top: 4px; line-height: 1.2; }
    .cell .label b { font-family: var(--font-title); font-size: 23px; }
    .pose-name { font-family: var(--font-note); font-size: 17px; color: #888; text-align: center; }
    /* bande de lisibilité petite taille */
    .strip { margin-top: 36px; border-top: 4px solid var(--ink); padding-top: 14px; }
    .strip h2 { font-family: var(--font-title); font-size: 28px; }
    .strip .items { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 12px; align-items: flex-end; }
    .strip .item { text-align: center; }
    .strip .item .nm { font-family: var(--font-note); font-size: 18px; margin-top: 2px; }
    .icons { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
    .icon { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #999; overflow: hidden; background: var(--paper); }
    .icon svg { display: block; }
    .icon-wrap { text-align: center; }
    .icon-wrap .nm { font-size: 15px; font-family: var(--font-note); }
  </style>
</head>
<body>
  <h1>Casting Scribble Pitch — 17 candidats</h1>
  <div id="board"></div>
  <div class="strip" id="strip">
    <h2>Test de lisibilité — 70&nbsp;px (feed) et 44&nbsp;px (icône ronde de highlight)</h2>
    <div class="items" id="small"></div>
    <div class="icons" id="icons"></div>
  </div>
  <script type="module">
    import { CANDIDATES } from '/brand/character/casting/candidates.js';
    import { wrap } from '/brand/character/casting/rig.js';

    const POSES = ['neutral', 'celebrating', 'dejected'];
    const board = document.getElementById('board');

    const byRole = new Map();
    for (const c of CANDIDATES) {
      if (!byRole.has(c.role)) byRole.set(c.role, []);
      byRole.get(c.role).push(c);
    }

    for (const [role, list] of byRole) {
      const cells = list.map((c) => `
        <div class="cell">
          <div class="poses">
            ${POSES.map((p) => `<div><div>${wrap(c.parts({ pose: p }), { size: 185 })}</div><div class="pose-name">${p}</div></div>`).join('')}
          </div>
          <div class="label"><b>${c.id}</b> — ${c.label}</div>
        </div>`).join('');
      board.insertAdjacentHTML('beforeend', `<div class="role"><h2>${role}</h2><div class="row">${cells}</div></div>`);
    }

    const small = document.getElementById('small');
    const icons = document.getElementById('icons');
    for (const c of CANDIDATES) {
      small.insertAdjacentHTML('beforeend',
        `<div class="item"><div>${wrap(c.parts({ pose: 'neutral' }), { size: 70 })}</div><div class="nm">${c.id}</div></div>`);
      const f = c.iconFocus;
      const vb = `${f.x - f.r} ${f.y - f.r} ${2 * f.r} ${2 * f.r}`;
      icons.insertAdjacentHTML('beforeend',
        `<div class="icon-wrap"><div class="icon">${wrap(c.parts({ pose: 'neutral' }), { size: 40, vb })}</div><div class="nm">${c.id}</div></div>`);
    }

    window.__shotReady = true;
  </script>
</body>
</html>
