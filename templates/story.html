<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scribble Pitch — story render</title>
  <link rel="stylesheet" href="/templates/fonts/fonts.css">
  <link rel="stylesheet" href="/brand/tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #888; }
    /* 1080×1920 ; l'UI Instagram recouvre ~250px en haut et en bas :
       tout le contenu vit entre y=250 et y=1670. */
    .story { position: relative; width: 1080px; height: 1920px; background: var(--paper); overflow: hidden; color: var(--ink); }
    svg.under, svg.over { position: absolute; inset: 0; pointer-events: none; }
    .content { position: absolute; inset: 0; z-index: 1; }
    svg.over { z-index: 2; }
    .kicker { position: absolute; top: 300px; left: 80px; font-family: var(--font-note);
      font-size: 52px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; transform: rotate(-1.2deg); }
    .big { position: absolute; top: 480px; left: 80px; right: 80px;
      font-family: var(--font-title); font-weight: 800; font-size: 88px; line-height: 1.1; }
    .note-mid { position: absolute; top: 850px; left: 120px; max-width: 640px;
      font-family: var(--font-note); font-weight: 700; font-size: 46px; transform: rotate(-1.5deg); }
    .mega { position: absolute; top: 430px; left: 50%; transform: translateX(-50%); white-space: nowrap;
      font-family: var(--font-title); font-weight: 800; font-size: 300px; line-height: 1; }
    .mega-unit { position: absolute; top: 760px; left: 0; right: 0; text-align: center;
      font-family: var(--font-note); font-weight: 700; font-size: 64px; }
    .char { position: absolute; left: 90px; bottom: 420px; }
    /* placeholder du sticker : juste le texte (pas de cadre) — l'utilisateur le
       recouvre avec le vrai sticker (lien / sondage / slider) dans l'app. */
    .sticker { position: absolute; right: 90px; width: 520px; height: 200px; bottom: 560px;
      display: flex; align-items: center; justify-content: center; text-align: center;
      font-family: var(--font-note); font-size: 36px; color: rgba(26,26,26,.38); padding: 20px; }
    .cta-line { position: absolute; bottom: 300px; left: 0; right: 0; text-align: center;
      font-family: var(--font-note); font-weight: 700; font-size: 44px; }
    .handle { position: absolute; bottom: 1680px; right: 80px; }
    .c-red { color: var(--red); } .c-orange { color: var(--orange); }
    .c-blue { color: var(--blue); } .c-ink { color: var(--ink); }
  </style>
</head>
<body>
  <div class="story" id="story">
    <svg class="under" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
    <div class="content" id="content"></div>
    <svg class="over" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  </div>
  <script type="module">
    import { createKit, hashSeed, esc, md } from '/templates/lib/slide-kit.js';
    import { analyst } from '/brand/character/poses.js';

    const CHARACTER_ACCENT = { otto: 'orange', numa: 'blue', vera: 'red' };

    window.__overflowWarnings = [];
    try {
      const params = new URLSearchParams(location.search);
      const date = params.get('date');
      const idx = parseInt(params.get('story') || '1', 10);

      const doc = await (await fetch(`/content/${date}/content.json`)).json();
      const story = (doc.stories || [])[idx - 1];
      if (!story) throw new Error(`story ${idx} absente (${(doc.stories || []).length} stories)`);

      const character = story.character || 'otto';
      const accent = story.accent || CHARACTER_ACCENT[character] || 'orange';

      await Promise.all([
        document.fonts.load('800 88px "Shantell Sans"'),
        document.fonts.load('800 300px "Shantell Sans"'),
        document.fonts.load('700 52px "Caveat"'),
      ]);
      await document.fonts.ready;

      const content = document.getElementById('content');
      const storyEl = document.getElementById('story');
      content.innerHTML = `
        <div class="kicker c-${accent} txt" id="kicker">${esc(story.kicker || '')}</div>
        ${story.big ? `<h1 class="big txt">${md(story.big)}</h1>` : ''}
        ${story.note ? `<div class="note-mid c-${accent} txt">${esc(story.note)}</div>` : ''}
        ${story.mega ? `<div class="mega txt" id="mega"${story.megaSize ? ` style="font-size:${story.megaSize}px"` : ''}>${esc(story.mega)}</div>
                        <div class="mega-unit c-${accent} txt">${md(story.unit || '')}</div>` : ''}
        <div class="char">${analyst({ character, pose: story.pose || 'neutral', expression: story.expression, mood: story.mood, size: 470 })}</div>
        ${story.sticker ? `<div class="sticker">${esc(story.sticker)}</div>` : ''}
        ${story.cta ? `<div class="cta-line c-${accent} txt">${esc(story.cta)}</div>` : ''}`;

      const kit = createKit({
        svgUnder: storyEl.querySelector('svg.under'),
        svgOver: storyEl.querySelector('svg.over'),
        slideEl: storyEl,
        seed: hashSeed(`${date}#story${idx}`),
      });
      if (story.kicker) kit.underline('#kicker', { color: accent, offset: 8 });
      kit.underlineAll(content, accent);
      if (story.mega) kit.circle('#mega', { color: accent, padX: 80, padY: 20 });

      // contrôle : le texte doit rester dans la zone utile (250px réservés haut/bas)
      const sRect = storyEl.getBoundingClientRect();
      for (const el of storyEl.querySelectorAll('.txt')) {
        const r = el.getBoundingClientRect();
        const tol = 4;
        if (
          r.left < sRect.left - tol ||
          r.top < sRect.top + 250 - tol ||
          r.right > sRect.right + tol ||
          r.bottom > sRect.top + 1670 + tol
        ) {
          window.__overflowWarnings.push(
            `story ${idx}: "${(el.textContent || '').slice(0, 40)}…" sort de la zone utile (250-1670)`
          );
        }
      }
    } catch (err) {
      window.__renderError = String(err && err.stack ? err.stack : err);
    }
    window.__renderDone = true;
  </script>
</body>
</html>
